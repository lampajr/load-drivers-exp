# Template for a driver
scripts:
  setup-driver:
  - script: sdk-select-jbang

  run-benchmark:
  - sh: if [ -f ${{HF_LOG}} ]; then rm -f ${{HF_LOG}}; fi
  - sh: if [ -f ${{HF_OUT}} ]; then rm -f ${{HF_OUT}}; fi
  - queue-download: ${{HF_LOG}}
  - queue-download: ${{HF_OUT}}
  - log: running hyperfoil wrk2 wrapper benchmark..
  - signal: BENCHMARK_STARTED
  - sh: jbang wrk2@hyperfoil -R ${{HF_RATE}} -c ${{HF_CONNECTIONS}} -t ${{HF_THREADS}} -d ${{HF_DURATION}} --latency ${{HF_ENDPOINT}} > ${{HF_OUT}}
  - signal: BENCHMARK_TERMINATED

  parse-metrics:
  - log: not yet implemented

  cleanup-driver:
  - sh: rm -f ${{HF_LOG}} ${{HF_OUT}}
  

states:
  HF_ENDPOINT: ${{TARGET_PROTOCOL}}://${{TARGET_HOST}}:${{TARGET_PORT}}/${{TARGET_ENDPOINT}}

  HF_RATE: ${{RATE}}
  HF_THREADS: ${{VUS}}
  HF_CONNECTIONS: ${{CONNECTIONS}}
  HF_DURATION: ${{DURATION}}
  HF_LOG: /tmp/hyperfoil/hyperfoil.local.log
  HF_OUT: /tmp/hyperfoil_run.log